# Production compose — runs the prebuilt image from GHCR (no local build).
#
# Usage on the server:
#   echo <PAT_or_password> | docker login ghcr.io -u <github-user> --password-stdin   # private repo only
#   IMAGE=ghcr.io/<owner>/<repo>:latest docker compose -f docker-compose.prod.yml up -d
#   # or put IMAGE=... into .env next to this file.
#
# New release: docker compose -f docker-compose.prod.yml pull api && docker compose -f docker-compose.prod.yml up -d

name: momentum

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-momentum}
      POSTGRES_USER: ${POSTGRES_USER:-momentum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}
    volumes:
      - momentum-postgres-data:/var/lib/postgresql/data
    # Deliberately NO ports: — in prod the DB is reachable only from the api
    # container over the compose network, never from the host/network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-momentum} -d ${POSTGRES_DB:-momentum}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: ${IMAGE:?IMAGE is required, e.g. ghcr.io/<owner>/<repo>:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-momentum};Username=${POSTGRES_USER:-momentum};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${Jwt__Secret:?Jwt__Secret is required — set it in .env (openssl rand -base64 48)}
      Jwt__Issuer: ${Jwt__Issuer:-momentum-api}
      Jwt__Audience: ${Jwt__Audience:-momentum-client}
      Jwt__AccessMinutes: ${Jwt__AccessMinutes:-15}
      Jwt__RefreshDays: ${Jwt__RefreshDays:-30}
      Cors__Origins: ${Cors__Origins:-}
      Telegram__BotToken: ${Telegram__BotToken:-}
      Telegram__BotUsername: ${Telegram__BotUsername:-}
      Telegram__EnablePolling: ${Telegram__EnablePolling:-true}
      Database__MigrateOnStartup: ${Database__MigrateOnStartup:-true}
      # Swagger is off in Production by default; set to "true" to expose it.
      Swagger__Enabled: ${Swagger__Enabled:-false}
    ports:
      # Bind to loopback: a reverse proxy (nginx/caddy/traefik) on the host
      # terminates TLS and forwards to 127.0.0.1:8080. Change to "8080:8080"
      # only if the API must be reachable directly.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  momentum-postgres-data:
